<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Khashmere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/khashmere-icon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <a href="/" class="logo">
      <img src="assets/khashmere-icon.svg" alt="" class="logo-icon">
      <span>KHASHMERE</span>
    </a>
    <div class="nav-links">
      <a href="pricing.html">PRICING</a>
      <a href="contact.html" class="active">CONTACT US</a>
    </div>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
      <span class="nav-toggle-line"></span>
      <span class="nav-toggle-line"></span>
      <span class="nav-toggle-line"></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <div class="mobile-menu-header">
      <a href="/" class="logo">
        <img src="assets/khashmere-icon.svg" alt="" class="logo-icon">
        <span>KHASHMERE</span>
      </a>
      <button class="mobile-menu-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <nav class="mobile-menu-nav" aria-label="Mobile navigation">
      <a href="pricing.html" class="mobile-menu-link">Pricing</a>
      <a href="contact.html" class="mobile-menu-link active">Contact Us</a>
    </nav>
  </div>

  <main class="contact-container">
    <!-- Atmospheric constellation accents -->
    <svg class="contact-constellation contact-constellation--top" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M40 60 Q160 30, 300 80" stroke="#d4af82" stroke-width="1.5" fill="none" opacity="0.3"/>
      <path d="M300 80 Q340 180, 240 240" stroke="#d4af82" stroke-width="1.5" fill="none" opacity="0.22"/>
      <path d="M40 60 Q90 160, 240 240" stroke="#d4af82" stroke-width="1.5" fill="none" opacity="0.18"/>
      <circle cx="40" cy="60" r="5" fill="#d4af82" opacity="0.5" class="node node-1"/>
      <circle cx="300" cy="80" r="4" fill="#d4af82" opacity="0.6" class="node node-2"/>
      <circle cx="240" cy="240" r="3" fill="#d4af82" opacity="0.4" class="node node-3"/>
    </svg>

    <svg class="contact-constellation contact-constellation--bottom" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M360 340 Q240 380, 100 320" stroke="#d4af82" stroke-width="1.5" fill="none" opacity="0.3"/>
      <path d="M100 320 Q60 220, 180 160" stroke="#d4af82" stroke-width="1.5" fill="none" opacity="0.22"/>
      <circle cx="360" cy="340" r="5" fill="#d4af82" opacity="0.5" class="node node-4"/>
      <circle cx="100" cy="320" r="4" fill="#d4af82" opacity="0.6" class="node node-5"/>
      <circle cx="180" cy="160" r="3" fill="#d4af82" opacity="0.4" class="node node-3"/>
    </svg>

    <div class="contact-content">
      <h1 class="contact-headline"><em>Get</em> in touch</h1>
      <p class="contact-intro">Send us an email or grab a time on our calendar.</p>

      <div class="contact-options">
        <a href="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ1QA_GVatW2ioAfNUgg6m_d7FfjYxc5EYWtRk3lodXmL7OyhJdyPliQDGRczuwRyW-bdDe4gH_I" target="_blank" rel="noopener noreferrer" class="contact-card">
          <div class="contact-card-glow" aria-hidden="true"></div>
          <svg class="contact-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M3 9h18"/>
            <path d="M8 3v4"/>
            <path d="M16 3v4"/>
            <circle cx="12" cy="14" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
          <div class="contact-card-text">
            <p class="contact-card-meta">Book a time</p>
            <p class="contact-card-value">30&#8209;minute Intro Call</p>
          </div>
          <span class="contact-card-cta">
            <span>Open calendar</span>
            <svg class="contact-card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </span>
        </a>

        <div class="contact-card contact-card--email">
          <div class="contact-card-glow" aria-hidden="true"></div>
          <svg class="contact-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
          <div class="contact-card-text">
            <p class="contact-card-meta">Email us</p>
            <p class="contact-card-value">info@khashmere.com</p>
          </div>
          <button type="button" class="contact-card-cta contact-card-cta--copy" data-copy-email="info@khashmere.com">
            <span class="cta-state cta-state--default">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="11" height="11" rx="2"/>
                <path d="M5 15V6a2 2 0 0 1 2-2h9"/>
              </svg>
              <span>Copy email</span>
            </span>
            <span class="cta-state cta-state--copied" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12l4 4 10-10"/>
              </svg>
              <span>Copied</span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer footer-v1 footer-minimal">
    <p class="copyright">© 2026 Khashmere. All rights reserved.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
