<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khashmere — Platform Architecture</title>
<style>
/* ─── Khashmere brand tokens ─────────────────────────────── */
:root {
  --soft-navy:      #3d4f61;
  --deep-navy:      #1f2d3a;
  --slate:          #2a3a4a;
  --warm-cream:     #f0ece8;
  --warm-gold:      #d4af82;
  --warm-gold-lt:   #e8c99a;
  --warm-gold-dim:  rgba(212,175,130,0.55);
  --warm-cream-dim: rgba(240,236,232,0.55);
  --terracotta:     #C87040;
  --sage:           #6B8C6A;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:100vw;height:100vh;overflow:hidden;
  background:var(--deep-navy);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;
  color:var(--warm-cream);
}

/* ── HEADER ── */
header{
  flex-shrink:0;height:54px;
  background:linear-gradient(90deg,#1f2d3a 0%,#2a3a4a 40%,#3d4f61 100%);
  border-bottom:1px solid rgba(212,175,130,0.35);
  display:flex;align-items:center;padding:0 20px;gap:14px;
}
.k-logo{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,#2a3a4a 0%,#1f2d3a 100%);
  border:1.5px solid var(--warm-gold);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;font-family:Georgia,serif;
  color:var(--warm-gold);
  box-shadow:0 0 14px rgba(212,175,130,0.4);
  flex-shrink:0;
}
.brand-name{
  font-size:20px;font-weight:800;letter-spacing:4px;
  color:var(--warm-gold);
  text-shadow:0 0 20px rgba(212,175,130,0.5);
}
.brand-sep{width:1px;height:22px;background:rgba(212,175,130,0.25);margin:0 4px;}
.brand-sub{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--warm-cream-dim);}

/* ── DIAGRAM ── */
.diagram-area{flex:1;overflow:hidden;}
#svg-d{width:100%;height:100%;}

/* ── CONTROLS ── */
.controls{
  flex-shrink:0;height:50px;
  background:#1f2d3a;
  border-top:1px solid rgba(212,175,130,0.25);
  display:flex;align-items:center;padding:0 16px;gap:12px;
}
.play-btn{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--warm-gold);
  cursor:pointer;background:linear-gradient(135deg,#2a3a4a,#1f2d3a);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 12px rgba(212,175,130,0.35);
  transition:box-shadow .2s,transform .2s;flex-shrink:0;
}
.play-btn:hover{box-shadow:0 0 22px rgba(212,175,130,0.65);transform:scale(1.08);}
.timeline{flex:1;display:flex;align-items:center;gap:10px;}
.t-label{font-family:'Courier New',monospace;font-size:11px;color:var(--warm-gold-dim);min-width:34px;}
input[type=range].seek{
  flex:1;-webkit-appearance:none;height:3px;border-radius:2px;
  background:rgba(212,175,130,0.18);outline:none;cursor:pointer;
}
input[type=range].seek::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--warm-gold);box-shadow:0 0 8px rgba(212,175,130,0.8);cursor:pointer;
}
.speed-btn{
  background:rgba(212,175,130,0.1);border:1px solid rgba(212,175,130,0.35);
  color:var(--warm-gold);font-size:11px;font-weight:700;padding:4px 10px;
  border-radius:5px;cursor:pointer;letter-spacing:1px;transition:background .2s;
}
.speed-btn:hover{background:rgba(212,175,130,0.25);}
</style>
</head>

function icon(play){
  playIcon.innerHTML=play
    ?'<rect x="2" y="2" width="4" height="12" fill="#d4af82" rx="1"/><rect x="10" y="2" width="4" height="12" fill="#d4af82" rx="1"/>'
    :'<polygon points="4,2 14,8 4,14" fill="#d4af82"/>';
}
function syncBar(){
  const p=(prog*100).toFixed(2)+'%';
  seekBar.style.background=`linear-gradient(90deg,#d4af82 ${p},rgba(212,175,130,.18) ${p})`;
}

function tick(ts){
  if(lastTs!==null && playing){
    const dt=Math.min((ts-lastTs)/1000,0.1);
    prog+=dt*SPEEDS[sIdx]/TOTAL;
    if(prog>1) prog-=1;
    seekBar.value=Math.round(prog*10000);
    tCur.textContent=fmt(prog*TOTAL);
    syncBar();
  }
  lastTs=ts;

  flows.forEach(f=>{
    if(!f.pe||f.len===0) return;
    f.balls.forEach((b,i)=>{
      if(!b) return;
      const t=(((prog*f.rs[i])+f.os[i])%1+1)%1;
      const pt=f.pe.getPointAtLength(t*f.len);
      b.setAttribute('transform',`translate(${pt.x},${pt.y})`);
      b.setAttribute('opacity','1');
    });
  });

  // ── Case study phase (seconds 30-45) ──
  const isCS=prog>CS_FRAC;
  csEls.title.setAttribute('opacity',isCS?'1':'0');
  csEls.src.setAttribute('opacity',isCS?'1':'0');
  csEls.con.setAttribute('opacity',isCS?'1':'0');
  if(isCS){
    const csP=(prog-CS_FRAC)/(1-CS_FRAC);
    const phase=Math.min(Math.floor(csP*5),4);
    const phaseP=(csP*5)%1;
    const glow=0.4+0.6*Math.abs(Math.sin(phaseP*Math.PI*6));
    csEls.fl.forEach((el,i)=>{
      const active=(phase===0&&i===0)||(phase===1&&i===1)
        ||(phase===2&&i===2)||(phase===3&&i===3)
        ||(phase===4&&(i===4||i===5));
      el.setAttribute('opacity',active?glow.toFixed(2):'0');
    });
    csEls.dash.setAttribute('opacity',phase===4?'1':'0');
  } else {
    csEls.fl.forEach(el=>el.setAttribute('opacity','0'));
    csEls.dash.setAttribute('opacity','0');
  }

  requestAnimationFrame(tick);
}

playBtn.addEventListener('click',()=>{
  playing=!playing;
  if(playing) lastTs=null;
  icon(playing);
});
seekBar.addEventListener('input',()=>{
  prog=seekBar.value/10000;
  tCur.textContent=fmt(prog*TOTAL);
  syncBar();
  lastTs=null;
});
speedBtn.addEventListener('click',()=>{
  sIdx=(sIdx+1)%SPEEDS.length;
  speedBtn.textContent=SL[sIdx];
});

icon(true);
syncBar();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
