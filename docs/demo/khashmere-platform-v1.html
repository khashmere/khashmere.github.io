<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khashmere — Platform Architecture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:100vw;height:100vh;overflow:hidden;
  background:#05081a;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;color:#fff;
}

/* ── HEADER ── */
header{
  flex-shrink:0;height:54px;
  background:linear-gradient(90deg,#0c0826 0%,#091228 50%,#0c0826 100%);
  border-bottom:1px solid rgba(124,58,237,0.45);
  display:flex;align-items:center;padding:0 20px;gap:14px;
}
.k-logo{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,#7c3aed 0%,#2563eb 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;font-family:Georgia,serif;
  box-shadow:0 0 18px rgba(124,58,237,0.6);flex-shrink:0;
}
.brand-name{
  font-size:20px;font-weight:800;letter-spacing:4px;
  background:linear-gradient(90deg,#a78bfa,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.brand-sep{width:1px;height:22px;background:rgba(124,58,237,0.35);margin:0 4px;}
.brand-sub{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.3);}

/* ── DIAGRAM ── */
.diagram-area{flex:1;overflow:hidden;position:relative;}
#svg-d{width:100%;height:100%;}

/* ── CONTROLS ── */
.controls{
  flex-shrink:0;height:50px;
  background:rgba(5,8,26,0.97);
  border-top:1px solid rgba(124,58,237,0.3);
  display:flex;align-items:center;padding:0 16px;gap:12px;
}
.play-btn{
  width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 12px rgba(124,58,237,0.5);
  transition:box-shadow .2s,transform .2s;flex-shrink:0;
}
.play-btn:hover{box-shadow:0 0 22px rgba(124,58,237,0.8);transform:scale(1.08);}
.timeline{flex:1;display:flex;align-items:center;gap:10px;}
.t-label{font-family:'Courier New',monospace;font-size:11px;color:rgba(167,139,250,.7);min-width:34px;}
input[type=range].seek{
  flex:1;-webkit-appearance:none;height:4px;border-radius:2px;
  background:rgba(124,58,237,0.2);outline:none;cursor:pointer;
}
input[type=range].seek::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:linear-gradient(135deg,#a78bfa,#60a5fa);
  box-shadow:0 0 8px rgba(167,139,250,0.9);cursor:pointer;
}
.speed-btn{
  background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.4);
  color:#a78bfa;font-size:11px;font-weight:700;padding:4px 10px;
  border-radius:5px;cursor:pointer;letter-spacing:1px;
  transition:background .2s;
}
.speed-btn:hover{background:rgba(124,58,237,0.32);}
</style>
</head>

<div class="controls">
  <button class="play-btn" id="playBtn">
    <svg id="playIcon" width="16" height="16" viewBox="0 0 16 16"></svg>
  </button>
  <div class="timeline">
    <span class="t-label" id="tCur">0:00</span>
    <input type="range" class="seek" id="seekBar" min="0" max="10000" value="0"/>
    <span class="t-label">0:30</span>
  </div>
  <button class="speed-btn" id="speedBtn">1×</button>
</div>

<script>
(function(){
'use strict';

// ── Constants ──
const TOTAL = 30;        // cycle length in seconds
const SPEEDS  = [0.25, 0.5, 1, 2, 4];
const S_LABEL = ['¼×',  '½×', '1×', '2×', '4×'];

// ── State ──
let playing = true;
let sIdx    = 2;         // speed index
let prog    = 0;         // 0–1 over TOTAL
let lastTs  = null;

// ── DOM ──
const playBtn  = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const seekBar  = document.getElementById('seekBar');
const tCur     = document.getElementById('tCur');
const speedBtn = document.getElementById('speedBtn');

// ── Flow config ──
// pathId, balls[], relSpeed[], offsets[]
const FLOWS = [
  { pid:'p-di',  balls:['b-di-0','b-di-1'],   rs:[2.0,2.0],   os:[0,   0.5] },
  { pid:'p-do',  balls:['b-do-0','b-do-1'],   rs:[2.0,2.0],   os:[0.25,0.75]},
  { pid:'p-sub', balls:['b-sub-0','b-sub-1'], rs:[1.0,1.0],   os:[0,   0.5] },
  { pid:'p-com', balls:['b-com-0','b-com-1'], rs:[1.0,1.0],   os:[0.2, 0.7] },
  { pid:'p-tm',  balls:['b-tm-0','b-tm-1'],   rs:[1.4,1.4],   os:[0,   0.5] },
  { pid:'p-tk',  balls:['b-tk-0'],             rs:[0.9],        os:[0.3]      },
  { pid:'p-sm',  balls:['b-sm-0','b-sm-1'],   rs:[0.8,0.8],   os:[0,   0.5] },
  { pid:'p-sk',  balls:['b-sk-0','b-sk-1'],   rs:[0.7,0.7],   os:[0.2, 0.7] },
];

// Resolve elements & cache path lengths
const flows = FLOWS.map(f => {
  const pe = document.getElementById(f.pid);
  return {
    pe,
    len: pe ? pe.getTotalLength() : 0,
    balls: f.balls.map(id => document.getElementById(id)),
    rs: f.rs,
    os: f.os,
  };
});

// ── Helpers ──
function fmtTime(s){
  const m = Math.floor(s/60);
  return `${m}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

function setIcon(isPlay){
  if(isPlay){
    // pause bars
    playIcon.innerHTML='<rect x="2" y="2" width="4" height="12" fill="white" rx="1"/><rect x="10" y="2" width="4" height="12" fill="white" rx="1"/>';
  } else {
    // play triangle
    playIcon.innerHTML='<polygon points="4,2 14,8 4,14" fill="white"/>';
  }
}

function syncSeek(){
  const p=(prog*100).toFixed(2)+'%';
  seekBar.style.background=`linear-gradient(90deg,#7c3aed ${p},rgba(124,58,237,.18) ${p})`;
}

// ── Animation loop ──
function tick(ts){
  if(lastTs!==null && playing){
    const dt = Math.min((ts-lastTs)/1000, 0.1);
    prog += dt * SPEEDS[sIdx] / TOTAL;
    if(prog>1) prog -= 1;
    seekBar.value = Math.round(prog*10000);
    tCur.textContent = fmtTime(prog*TOTAL);
    syncSeek();
  }
  lastTs = ts;

  // move balls
  flows.forEach(f=>{
    if(!f.pe || f.len===0) return;
    f.balls.forEach((b,i)=>{
      if(!b) return;
      const t = (((prog * f.rs[i]) + f.os[i]) % 1 + 1) % 1;
      const pt = f.pe.getPointAtLength(t * f.len);
      b.setAttribute('cx', pt.x);
      b.setAttribute('cy', pt.y);
      b.setAttribute('opacity','1');
    });
  });

  requestAnimationFrame(tick);
}

// ── Controls ──
playBtn.addEventListener('click',()=>{
  playing=!playing;
  if(playing) lastTs=null;
  setIcon(playing);
});

seekBar.addEventListener('input',()=>{
  prog = seekBar.value/10000;
  tCur.textContent = fmtTime(prog*TOTAL);
  syncSeek();
  lastTs=null;
});

speedBtn.addEventListener('click',()=>{
  sIdx=(sIdx+1)%SPEEDS.length;
  speedBtn.textContent=S_LABEL[sIdx];
});

// ── Kick off ──
setIcon(true);
syncSeek();
requestAnimationFrame(tick);
})();
</script>
